$kind: http-request
url: "{{baseUrl}}/doctors/queue"
method: GET
headers:
  Authorization: Bearer {{patient_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 403 Forbidden', function () {
          pm.response.to.have.status(403);
      });
    language: text/javascript
order: 3000

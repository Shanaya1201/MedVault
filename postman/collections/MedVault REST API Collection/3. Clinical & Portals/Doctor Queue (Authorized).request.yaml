$kind: http-request
url: "{{baseUrl}}/doctors/queue"
method: GET
headers:
  Authorization: Bearer {{doctor_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
    language: text/javascript
order: 2000

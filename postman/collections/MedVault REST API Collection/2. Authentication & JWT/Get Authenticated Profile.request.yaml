$kind: http-request
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Authorization: Bearer {{patient_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      var json = pm.response.json();
      pm.expect(json.data.user.role).to.eql('PATIENT');
    language: text/javascript
order: 5000

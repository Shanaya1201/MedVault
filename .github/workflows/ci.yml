name: MedVault Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-ci:
    name: Backend API & Real-Time Test Suite (Node 20)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Run Master Backend & Experiment Test Suite
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/medvault_ci
          JWT_SECRET: ci_test_jwt_secret_key_2026_x89!
          CLIENT_URL: http://localhost:5173
        run: npm test

  client-ci:
    name: Frontend Quality & Production Build (Node 20)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run ESLint / Code Quality Checks
        run: npm run lint

      - name: Build Production Vite Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/index.html || (echo "dist/index.html not found!" && exit 1)
          echo "Production build verified successfully."
